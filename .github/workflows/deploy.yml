name: deploy

# ViewEngine Markup (markup.viewengine.dev). Every push to `viewengine` is checked
# and, if green, deployed; pull requests into it are only checked. `main` is a
# clean mirror of upstream MarkLayer and never deploys.
#
# Secrets (repo settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Workers Scripts, D1, R2 and KV edit on the account below
#   CLOUDFLARE_ACCOUNT_ID  26108e3201e299582e4f6df2912f0b19

on:
  push:
    branches: [viewengine]
  pull_request:
    branches: [viewengine]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Upstream does not commit bun.lock, so there is nothing to freeze against.
      - run: bun install
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/viewengine'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      # Builds the site first (turbo orders it), then the worker that embeds it.
      - run: bunx turbo run build --filter=@marklayer/worker...
      # Before the deploy, so new code never runs against an old schema.
      - name: Apply D1 migrations
        working-directory: apps/worker
        run: bunx wrangler d1 migrations apply markup-viewengine --remote
      - name: Deploy markup.viewengine.dev
        working-directory: apps/worker
        run: bunx wrangler deploy
      - name: Deploy markup.viewengine.ai redirect
        working-directory: deploy/redirect-ai
        run: bunx wrangler deploy
      - name: Smoke test
        run: |
          set -e
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          test "$(code https://markup.viewengine.dev/)" = 200
          test "$(code https://markup.viewengine.dev/cli/oauth-client.json)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST https://markup.viewengine.dev/mcp)" = 401
          test "$(code https://markup.viewengine.ai/)" = 301
          echo "smoke test passed"
